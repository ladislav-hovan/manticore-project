[workspace]
authors = ["Ladislav Hovan <19410951+ladislav-hovan@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "manticore-project"
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "0.2.0"

[package.build.backend]
name = "pixi-build-r"
channel = "conda-forge"

[tasks]
install-local = "R CMD INSTALL ./"
install-mori = "R -e 'install.packages(\"mori\", repos = \"https://cloud.r-project.org\")'"

[dependencies]
bioconductor-biomart = ">=2.62.0,<3"
bioconductor-fgsea = ">=1.32.2,<2"
r-base = "4.4.*"
r-circlize = ">=0.4.18,<0.5"
r-cli = ">=3.6.6,<4"
r-devtools = ">=2.4.0,<3"
r-dplyr = ">=1.2.1,<2"
r-furrr = ">=0.4.0,<0.5"
r-future = ">=1.80.0,<2"
r-igraph = ">=2.3.4,<3"
r-irlba = ">=2.4.1,<3"
r-matrix = ">=1.7_6,<2"
r-pbapply = ">=1.7_4,<2"
r-rann = ">=2.6.2,<3"
r-rhpcblasctl = ">=0.23_42,<0.24"
